lock:
  name: Lock
  description: Lock the configured Nuki device using encrypted ctoken authentication.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if more than one Nuki ctoken entry is configured.
      example: "01JABCDE1234567890ABCDE123"
      selector:
        text:
    source:
      name: Source
      description: Optional free-text source, for example the automation name. This is written to logs and the nuki_ctoken_action event.
      example: "automation.front_door_night_lock"
      selector:
        text:

unlock:
  name: Unlock
  description: Unlock the configured Nuki device using encrypted ctoken authentication.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if more than one Nuki ctoken entry is configured.
      selector:
        text:
    source:
      name: Source
      description: Optional free-text source, for example the automation name. This is written to logs and the nuki_ctoken_action event.
      selector:
        text:

open:
  name: Open / unlatch
  description: Open or unlatch the configured Nuki device. For a Smart Lock this usually pulls the latch; for an Opener it triggers the opener action.
  fields:
    entry_id:
      name: Config entry ID
      description: Optional. Required only if more than one Nuki ctoken entry is configured.
      selector:
        text:
    source:
      name: Source
      description: Optional free-text source, for example the automation name. This is written to logs and the nuki_ctoken_action event.
      selector:
        text:

