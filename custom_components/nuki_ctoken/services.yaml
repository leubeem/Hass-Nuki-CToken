lock:
  name: Lock
  description: Lock the configured Nuki device using encrypted ctoken authentication.
  fields:
    entry_id:
      name: Device
      description: Optional. Required only when more than one Nuki device is configured.
      selector:
        config_entry:
          integration: nuki_ctoken
    source:
      name: Source
      description: Optional free-text label written to logs and the nuki_ctoken_action event. Useful for identifying which automation triggered the action.
      example: "automation.front_door_night_lock"
      selector:
        text:

unlock:
  name: Unlock
  description: Unlock the configured Nuki device using encrypted ctoken authentication.
  fields:
    entry_id:
      name: Device
      description: Optional. Required only when more than one Nuki device is configured.
      selector:
        config_entry:
          integration: nuki_ctoken
    source:
      name: Source
      description: Optional free-text label written to logs and the nuki_ctoken_action event.
      selector:
        text:

open:
  name: Open / unlatch
  description: >
    Open or unlatch the configured Nuki device (action 3).
    For a Smart Lock this pulls the latch; for an Opener it triggers the opener action.
  fields:
    entry_id:
      name: Device
      description: Optional. Required only when more than one Nuki device is configured.
      selector:
        config_entry:
          integration: nuki_ctoken
    source:
      name: Source
      description: Optional free-text label written to logs and the nuki_ctoken_action event.
      selector:
        text:

lockngo:
  name: Lock 'n' Go
  description: Run Nuki Lock 'n' Go using encrypted ctoken authentication.
  fields:
    entry_id:
      name: Device
      description: Optional. Required only when more than one Nuki device is configured.
      selector:
        config_entry:
          integration: nuki_ctoken
    source:
      name: Source
      description: Optional free-text label written to logs and the nuki_ctoken_action event.
      selector:
        text:

lockngo_open:
  name: Lock 'n' Go with unlatch
  description: Run Nuki Lock 'n' Go with unlatch using encrypted ctoken authentication.
  fields:
    entry_id:
      name: Device
      description: Optional. Required only when more than one Nuki device is configured.
      selector:
        config_entry:
          integration: nuki_ctoken
    source:
      name: Source
      description: Optional free-text label written to logs and the nuki_ctoken_action event.
      selector:
        text:
